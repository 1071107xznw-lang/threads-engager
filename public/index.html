<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>內容中心</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; color: #1c1c1e; background: #fff; }
    html { background: #fff; }
    header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    h2 { margin: 0; }
    select, button { font-size: 15px; padding: 6px 12px; border-radius: 8px; border: 1px solid #ccc; cursor: pointer; background: #fff; }
    button.primary { background: #1c1c1e; color: #fff; border-color: #1c1c1e; }
    button.danger { background: #b3261e; color: #fff; border-color: #b3261e; }
    .tabs { display: flex; gap: 8px; margin: 16px 0; border-bottom: 1px solid #e0e0e0; }
    .tab { border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 8px 12px; background: none; color: #666; }
    .tab.active { color: #1c1c1e; border-bottom-color: #1c1c1e; font-weight: 600; }
    section { display: none; }
    section.active { display: block; }
    .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .card { border: 1px solid #e0e0e0; border-radius: 12px; padding: 16px; margin: 16px 0; }
    .meta { font-size: 13px; color: #666; margin-bottom: 8px; }
    .meta a { color: #0a66c2; }
    .angle { font-weight: 600; color: #1c1c1e; }
    .content { white-space: pre-wrap; background: #f6f6f6; padding: 10px; border-radius: 8px; font-size: 14px; }
    textarea { width: 100%; min-height: 90px; margin-top: 10px; font-size: 15px; padding: 8px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
    .count { font-size: 12px; color: #999; text-align: right; }
    .sched { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .sched input { font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid #ccc; }
    .sched .topic { flex: 1; min-width: 140px; }
    .actions { margin-top: 10px; display: flex; gap: 8px; }
    .status { color: #666; font-size: 14px; }
    #dryrun { font-size: 12px; padding: 3px 8px; border-radius: 999px; cursor: pointer; user-select: none; }
    #dryrun.on { background: #fff3cd; color: #7a5b00; border: 1px solid #ffe28a; }
    #dryrun.off { background: #fde8e6; color: #8a1c16; border: 1px solid #f6b8b2; }
    .statusbar { font-size: 13px; color: #666; margin-top: 6px; }
    .statusbar a { color: #0a66c2; }
    .hint { background: #f0f7ff; border: 1px solid #cfe3ff; color: #234; padding: 12px 14px; border-radius: 10px; font-size: 14px; margin: 12px 0; }
    h3 { margin: 24px 0 4px; }
  </style>
</head>
<body>
  <header>
    <h2 id="brandTitle">內容中心</h2>
    <span id="dryrun" title="點擊切換乾跑 / 正式模式"></span>
  </header>
  <div id="statusbar" class="statusbar"></div>

  <div class="tabs">
    <button class="tab active" data-tab="native">原生貼文</button>
    <button class="tab" data-tab="reply">回覆審核</button>
  </div>

  <!-- 原生貼文：產稿 → 審核 → 發布 -->
  <section id="native" class="active">
    <div class="bar">
      <button id="gen" class="primary">產生草稿</button>
      <span id="nstatus" class="status"></span>
    </div>
    <div id="aiHint" class="hint" style="display:none">
      未偵測到 <code>claude</code> CLI，AI 自動產稿已停用。你仍可在下方「自己寫一則」直接撰寫貼文。<br>
      想用 AI 幫你想內容？在本機安裝並登入 <code>claude</code> CLI 後重新整理即可啟用。
    </div>
    <h3>自己寫一則</h3>
    <div class="card">
      <textarea id="manualText" maxlength="500" placeholder="直接把想發的貼文內容寫在這裡…"></textarea>
      <div class="count" id="manualCount">0/500</div>
      <div class="actions">
        <button id="manualAdd" class="primary">加入待審核</button>
        <span id="mstatus" class="status"></span>
      </div>
    </div>
    <h3>待審核</h3>
    <div id="ndrafted"></div>
    <h3>已核准（待發布）</h3>
    <div id="napproved"></div>
  </section>

  <!-- 回覆審核：既有流程 -->
  <section id="reply">
    <div class="bar">
      <button id="scrape">搜尋候選串</button>
      <button id="send" class="primary">送出已核准</button>
      <span id="rstatus" class="status"></span>
      <select id="account" hidden></select>
    </div>
    <div id="queue"></div>
  </section>

  <script src="/app.js"></script>
</body>
</html>
